
name: Unpack and Build NeoForge Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f \
            -iname '*NeoForge-source*.zip' \
            -print -quit)

          if [ -n "$ZIP" ]; then
            mkdir extracted
            unzip -o "$ZIP" -d extracted
            cp -a extracted/. .
            rm -rf extracted
          fi

          echo "Project files:"
          ls -la

      - name: Make Gradle executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build mod
        run: |
          if [ -f gradlew ]; then
            ./gradlew --no-daemon build
          else
            echo "ERROR: gradlew not found in repository root"
            exit 1
          fi

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GameDiscsPlus-NeoForge-1.21.1
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
          if-no-files-found: error
